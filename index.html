<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamForGeophysics — Deep Target Interpretation</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <link rel="stylesheet" href="/static/css/llm-chat.css">
</head>

<body>
    <!-- 隐藏的文件选择器 -->
    <input type="file" id="sgyFileInput" accept=".sgy,.SGY,.segy,.SEGY" style="display:none">
    <input type="file" id="imageFileInput" accept="image/*" style="display:none">
    <input type="file" id="csvFileInput" accept=".csv,.CSV" style="display:none">
    <input type="file" id="vdsFileInput" accept=".vds,.vdso,.VDS,.VDSO" style="display:none">
    <input type="file" id="gtFileInput" accept=".png,.jpg,.jpeg,.bmp,.tif,.tiff,.PNG,.JPG,.JPEG,.BMP,.TIF,.TIFF,.csv,.CSV" style="display:none">

    <!-- 工具栏 -->
    <div class="toolbar">
        <button class="action-btn" style="padding:1px 15px; font-weight:bold;">SamForGeophysics</button>

        <span style="color:var(--ui-border);">|</span>
        <button class="action-btn" id="btnLoadSGY">📂 加载 SGY</button>
        <button class="action-btn" id="btnLoadVDS">📂 加载 VDS</button>
        <button class="action-btn" id="btnGenSlices" disabled>🔪 生成切片</button>
        <button class="action-btn" id="btnLoadImage">🖼 加载图片</button>

        <span style="color:var(--ui-border);">|</span>
        <div class="btn-group">
            <div class="control-btn" id="btnFirst" title="第一条 (Home)">|⏮</div>
            <div class="control-btn" id="btnPrev10" title="前 10 条 (PgUp)">⏮10</div>
            <div class="control-btn" id="btnPrev" title="前一条 (←)">⏮</div>
            <div class="control-btn" id="btnPlay" title="播放/暂停 (Space)">▶</div>
            <div class="control-btn" id="btnNext" title="后一条 (→)">⏭</div>
            <div class="control-btn" id="btnNext10" title="后 10 条 (PgDn)">⏭10</div>
            <div class="control-btn" id="btnLast" title="最后一条 (End)">⏭|</div>
        </div>
        <label style="font-size:11px"><input type="checkbox" id="loopCb" checked> Loop</label>
        <input type="number" id="fpsInput" value="4" min="1" max="30" title="FPS" style="width:36px">
        <span style="font-size:11px">fps</span>

        <span style="color:var(--ui-border);">|</span>
        <span style="font-size:11px">方向</span>
        <select id="dirSelect" style="font-size:11px;padding:0 2px;">
            <option value="inline">Inline</option>
            <option value="crossline">Crossline</option>
            <option value="timeslice">TimeSlice</option>
        </select>
        <span id="lineRangeLabel" style="font-size:11px;color:#555;"></span>
        <input type="number" id="lineNo" min="0" step="1" style="width:70px" placeholder="Line号">
        <button class="action-btn" id="btnGoLine">Go</button>

        <span style="color:var(--ui-border);">|</span>
        <span style="font-size:11px">Y轴</span>
        <select id="yUnitSelect" style="font-size:11px;padding:0 2px;">
            <option value="time">Time (ms)</option>
            <option value="depth">Depth (m)</option>
        </select>
        <input type="number" id="velocityInput" value="3000" min="100" max="20000" title="时深转换速度" style="width:55px">
        <span style="font-size:11px">m/s</span>
        <button class="action-btn" id="btnApplyVelocity">Apply</button>

        <span style="color:var(--ui-border);">|</span>
        <button class="action-btn" id="btnGainUp" title="增益 (减小clip, 波形变大) [Q]">🔊 增益(Q)</button>
        <button class="action-btn" id="btnGainDown" title="减益 (增大clip, 波形变小) [W]">🔉 减益(W)</button>
        <button class="action-btn" id="btnScaleYUp" title="纵向拉伸 (放大上下) [Z]">↕️ 放大(Z)</button>
        <button class="action-btn" id="btnScaleYDown" title="纵向压缩 (缩小上下) [Shift+Z]">↕️ 缩小(⇧Z)</button>
        <button class="action-btn" id="btnScaleXUp" title="横向拉伸 (放大左右) [T]">↔️ 放大(T)</button>
        <button class="action-btn" id="btnScaleXDown" title="横向压缩 (缩小左右) [Shift+T]">↔️ 缩小(⇧T)</button>
        <button class="action-btn" id="btnFitWindow" title="自适应窗口 (重置缩放比例) [F]">🔲 自适应(F)</button>

        <span style="color:var(--ui-border);">|</span>
        <span style="font-size:11px">显示</span>
        <select id="displayMode" style="font-size:11px;padding:0 2px;">
            <option value="vd">Seismic Color</option>
            <option value="wv">Wiggle</option>
        </select>
        <label style="font-size:11px"><input type="checkbox" id="samMode" checked> SAM</label>
        <label style="font-size:11px"><input type="checkbox" id="logitsMode" checked> Logits</label>

        <span style="color:var(--ui-border);">|</span>
        <span style="font-size:11px">🔧 设备</span>
        <select id="deviceSelect" style="font-size:11px;padding:0 2px;max-width:180px;" title="SAM 推理设备 (模型加载后不可切换)">
            <option value="auto">加载中...</option>
        </select>

        <span style="color:var(--ui-border);">|</span>
        <button class="action-btn" id="btnInclude">Include</button>
        <button class="action-btn active" id="btnExclude">Exclude</button>
        <button class="action-btn" id="btnDelPoints">Undo</button>
        <button class="action-btn" id="btnClearMask">Clear</button>
        <button class="action-btn" id="btnRunSAM" style="font-weight:bold;color:#0055cc;" title="运行 SAM3 分割推理 (拾取点后点击)">▶ SAM</button>
        <button class="action-btn" id="btnExportMask" style="color:#880088;" title="导出 SAM 分割轮廓为多边形">📦 Export Mask</button>
        <button class="action-btn" id="btnValidate" style="color:#0066aa;" title="验证 SAM 分割结果精度 (需先运行 SAM)">✅ 验证</button>
        <button class="action-btn" id="btnExport" style="font-weight:bold;color:#005500;">Export</button>
        <button class="action-btn" id="btnImportCSV" title="导入之前导出的 CSV 拾取文件">📥 Import</button>
        <button class="action-btn" id="btnSave" title="保存拾取到浏览器本地">💾 Save</button>
        <button class="action-btn" id="btnRestore" title="从浏览器本地恢复拾取">📂 Restore</button>
        <button class="action-btn" id="btnReset" title="重置到初始状态">🗑 Reset</button>

        <span style="color:var(--ui-border);">|</span>
        <span id="statusIndicator" class="status-idle"></span>
        <span id="statusText" style="font-size:11px;color:#555;">未连接</span>
        <span style="color:var(--ui-border);">|</span>
        <span id="fpsCounter" style="font-size:10px;color:#888;font-family:monospace;"></span>
    </div>

    <!-- 主展示区 -->
    <div class="main-container">
        <div class="plot-header" style="text-align:center;margin-bottom:4px;">
            <div id="plotSubtitle" style="font-size:14px;font-weight:bold;">Line no.=1511 (Panel=467)</div>
        </div>

        <!-- 顶部 IL/XL 横坐标 -->
        <div class="flex" style="height:24px;">
            <div style="width:70px;position:relative;border-bottom:1px solid #000;" class="text-xs">
                <div style="position:absolute;right:25px;bottom:2px;text-align:center;">IL<br>XL</div>
            </div>
            <div id="topAxis" class="flex-1 border-b border-black relative text-xs"></div>
        </div>

        <div class="flex flex-1 overflow-hidden">
            <!-- 左侧 Y 轴 -->
            <div class="axis-y" id="leftAxis" style="width:70px;">
                <div class="axis-label-v" id="yAxisLabel" style="left:2px;">Time (ms)</div>
            </div>

            <!-- 画布 -->
            <div class="workspace">
                <canvas id="seismicCanvas"></canvas>
                <div id="infoBox"></div>
            </div>

        </div>
    </div>

    <!-- 切片浏览面板 -->
    <div id="slicePanel">
        <div style="display:flex;gap:10px;align-items:center;">
            <span id="slicePosLabel" style="font-size:11px;font-weight:bold;min-width:180px;"></span>
            <input type="range" id="lineSlider" min="0" max="0" value="0" step="1"
                   style="flex:1" title="拖动浏览切片">
            <span id="sliceLineNo" style="font-size:11px;font-weight:bold;min-width:80px;color:#333;"></span>
        </div>
    </div>

    <footer style="display:flex;justify-content:space-between;align-items:center;">
        <span>SamForGeophysics · Kiroween 2026 entry · MIT</span>
        <span id="backupStatus" style="color:#666;font-size:10px;" title="浏览器本地备份状态"></span>
    </footer>

    <!-- 生成切片选项弹窗 -->
    <div id="genSlicesModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title">
                <span>🔪 生成切片</span>
                <div class="modal-close" id="genModalClose">✕</div>
            </div>
            <div class="modal-body">
                <!-- Inline -->
                <div class="modal-row">
                    <label><input type="checkbox" id="genIL" checked> Inline</label>
                    <span>间隔</span>
                    <input type="number" id="genILStep" value="5" min="1" style="width:55px">
                    <span style="font-size:11px;color:#666;" id="genILPreview"></span>
                </div>
                <div class="modal-row" style="padding-left:62px;">
                    <span>范围</span>
                    <input type="number" id="genILFrom" placeholder="起始" style="width:65px">
                    <span>~</span>
                    <input type="number" id="genILTo" placeholder="终止" style="width:65px">
                    <span style="font-size:11px;color:#888;">(留空=全部)</span>
                </div>
                <!-- Crossline -->
                <div class="modal-row">
                    <label><input type="checkbox" id="genXL"> Crossline</label>
                    <span>间隔</span>
                    <input type="number" id="genXLStep" value="5" min="1" style="width:55px">
                    <span style="font-size:11px;color:#666;" id="genXLPreview"></span>
                </div>
                <div class="modal-row" style="padding-left:72px;">
                    <span>范围</span>
                    <input type="number" id="genXLFrom" placeholder="起始" style="width:65px">
                    <span>~</span>
                    <input type="number" id="genXLTo" placeholder="终止" style="width:65px">
                    <span style="font-size:11px;color:#888;">(留空=全部)</span>
                </div>
                <!-- TimeSlice -->
                <div class="modal-row">
                    <label><input type="checkbox" id="genTS"> TimeSlice</label>
                    <span>间隔</span>
                    <input type="number" id="genTSStep" value="50" min="1" style="width:55px">
                    <span style="font-size:11px;color:#666;" id="genTSPreview"></span>
                </div>
                <div class="modal-row" style="padding-left:75px;">
                    <span>范围</span>
                    <input type="number" id="genTSFrom" placeholder="起始ms" style="width:65px">
                    <span>~</span>
                    <input type="number" id="genTSTo" placeholder="终止ms" style="width:65px">
                    <span style="font-size:11px;color:#888;">(留空=全部)</span>
                </div>
                <div class="gen-preview" id="genTotalPreview"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" id="genModalCancel">取消</button>
                <button class="modal-btn primary" id="genModalOK">确定生成</button>
            </div>
        </div>
    </div>

    <!-- 崩溃恢复弹窗 -->
    <div id="recoveryModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title">
                <span>📂 崩溃恢复</span>
                <div class="modal-close" id="recoveryModalClose">✕</div>
            </div>
            <div class="modal-body">
                <p id="recoveryMessage">检测到浏览器本地有之前保存的拾取数据，是否恢复？</p>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" id="recoveryDiscard">丢弃</button>
                <button class="modal-btn primary" id="recoveryRestore">恢复</button>
            </div>
        </div>
    </div>

    <!-- 验证结果弹窗 -->
    <div id="validationModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-title">
                <span>✅ 分割结果验证</span>
                <div class="modal-close" id="validationModalClose">✕</div>
            </div>
            <div class="modal-body" id="validationBody"></div>
            <div class="modal-footer">
                <button class="modal-btn primary" id="validationModalOk">关闭</button>
            </div>
        </div>
    </div>

    <!-- LLM 配置弹窗 -->
    <div id="llmConfigModal" class="modal-overlay" style="display:none;">
        <div class="modal-box" style="min-width:480px;">
            <div class="modal-title">
                <span>⚙️ AI 助手设置</span>
                <div class="modal-close" id="llmConfigClose">✕</div>
            </div>
            <div class="modal-body">
                <div class="modal-row">
                    <label>提供商</label>
                    <select id="llmProviderSelect" style="border:1px solid var(--ui-border);padding:2px 4px;font-size:12px;min-width:200px;">
                        <option value="anthropic">Anthropic (Claude)</option>
                        <option value="openai">OpenAI (GPT-4o)</option>
                        <option value="local">Local (Ollama/vLLM)</option>
                    </select>
                </div>
                <div class="modal-row">
                    <label>API Key</label>
                    <input type="password" id="llmApiKey" style="border:1px solid var(--ui-border);padding:2px 4px;font-size:12px;min-width:280px;" placeholder="输入 API Key（仅保存于服务器）">
                </div>
                <div class="modal-row">
                    <label>模型</label>
                    <input type="text" id="llmModel" style="border:1px solid var(--ui-border);padding:2px 4px;font-size:12px;min-width:280px;" placeholder="模型名称">
                </div>
                <div class="modal-row" id="providerLocalUrlRow">
                    <label>API URL</label>
                    <input type="text" id="llmLocalUrl" style="border:1px solid var(--ui-border);padding:2px 4px;font-size:12px;min-width:280px;" placeholder="http://localhost:11434/v1">
                </div>
                <div class="modal-row" style="align-items:flex-start;">
                    <label>系统提示词</label>
                    <textarea id="llmSystemPrompt" style="border:1px solid var(--ui-border);padding:3px 5px;font-size:12px;width:100%;height:80px;resize:vertical;" placeholder="自定义 AI 助手的行为指令..."></textarea>
                </div>
                <div id="llmConnectionStatus" class="connection-status" style="display:none;"></div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" id="llmConfigTest">测试连接</button>
                <button class="modal-btn" id="llmConfigCancel">取消</button>
                <button class="modal-btn primary" id="llmConfigSave">保存</button>
            </div>
        </div>
    </div>

    <!-- JS modules -->
    <script src="/static/js/storage.js"></script>
    <script src="/static/js/canvas.js"></script>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/sgy-client.js"></script>
    <script src="/static/js/sam-client.js"></script>
    <script src="/static/js/llm-client.js"></script>
</body>

</html>
