services:
  sam3:
    build:
      context: .
      dockerfile: Dockerfile
    image: sam3-seismic:latest
    container_name: sam3-seismic

    # ── GPU reservation (requires nvidia-container-toolkit on host) ──
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1              # or "all" for multi-GPU
              capabilities: [gpu]

    ports:
      - "${SAM3_PORT:-8000}:8000"   # host port customisable via .env

    volumes:
      - ./data:/app/data            # weights · DB · uploads · converted volumes

    environment:
      - SAM3_HOST=0.0.0.0
      - SAM3_PORT=8000

    env_file:
      - path: .env
        required: false             # .env is optional; defaults apply without it

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    restart: unless-stopped
    shm_size: "2gb"
